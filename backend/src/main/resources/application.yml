server:
  address: ${SERVER_HOST:localhost}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dragons
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - redis

openai:
  api-key: ${OPENAI_API_KEY:}