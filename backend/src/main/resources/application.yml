server:
  address: ${SERVER_HOST}
  port: ${SERVER_PORT}

spring:
  application:
    name: dragons
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  health:
    redis:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - redis

openai:
  api-key: ${OPENAI_API_KEY}